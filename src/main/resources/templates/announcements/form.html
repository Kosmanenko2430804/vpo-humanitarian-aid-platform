<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{base :: layout(~{::title}, ~{::main})}"
      lang="uk">
<head>
    <title th:text="${announcement != null} ? 'Редагувати оголошення' : 'Нове оголошення'">Оголошення</title>
</head>
<body>
<main>
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body p-4">
                    <h3 class="fw-bold mb-4" th:text="${announcement != null} ? 'Редагувати оголошення' : 'Нове оголошення'"></h3>

                    <form th:action="${announcement != null} ? @{/announcements/{id}/edit(id=${announcement.id})} : @{/announcements/new}"
                          th:object="${announcementForm}"
                          method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Заголовок *</label>
                            <input type="text" th:field="*{title}"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                                   class="form-control" placeholder="Назва оголошення">
                            <div class="invalid-feedback" th:errors="*{title}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Опис *</label>
                            <textarea th:field="*{description}"
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                      class="form-control" rows="5" placeholder="Детальний опис..."></textarea>
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Місто *</label>
                            <input type="text" th:field="*{city}"
                                   th:classappend="${#fields.hasErrors('city')} ? 'is-invalid'"
                                   class="form-control" placeholder="Київ">
                            <div class="invalid-feedback" th:errors="*{city}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Категорії *</label>
                            <div class="row g-2" id="categoriesGroup">
                                <div th:each="cat : ${categories}" class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input category-check" type="checkbox"
                                               name="categoryIds" th:value="${cat.id}"
                                               th:id="'cat' + ${cat.id}"
                                               th:checked="${announcementForm.categoryIds != null && announcementForm.categoryIds.contains(cat.id)}">
                                        <label class="form-check-label" th:for="'cat' + ${cat.id}"
                                               th:text="${cat.name}"></label>
                                    </div>
                                </div>
                            </div>
                            <div id="categoryError" class="text-danger small mt-1 d-none">Оберіть принаймні одну категорію</div>
                            <div th:if="${#fields.hasErrors('categoryIds')}" class="text-danger small mt-1"
                                 th:errors="*{categoryIds}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Посилання на збір коштів <span class="text-muted fw-normal">(необов'язково)</span></label>
                            <input type="url" th:field="*{donationUrl}" class="form-control">
                            <div class="form-text">Вкажіть посилання на Monobank банку або ПриватБанк конверт, якщо хочете приймати фінансову підтримку</div>
                        </div>

                        <!-- Only for PROVIDER -->
                        <div sec:authorize="hasRole('PROVIDER')" class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" name="acceptsApplications"
                                   id="acceptsApps"
                                   th:checked="${announcementForm.acceptsApplications == null || announcementForm.acceptsApplications}">
                            <label class="form-check-label" for="acceptsApps">Приймати заявки від ВПО</label>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Зберегти</button>
                            <a href="/cabinet" class="btn btn-outline-secondary">Скасувати</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
document.querySelector('form').addEventListener('submit', function(e) {
    const checked = document.querySelectorAll('.category-check:checked').length;
    const errorEl = document.getElementById('categoryError');
    if (checked === 0) {
        e.preventDefault();
        errorEl.classList.remove('d-none');
    } else {
        errorEl.classList.add('d-none');
    }
});
</script>
</main>
</body>
</html>
