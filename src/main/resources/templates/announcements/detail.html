<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
      lang="uk">
<head>
    <title th:text="${announcement.title} + ' — ВПО Платформа'">Оголошення</title>
</head>
<body>
<main>
<div class="container py-4">
<div class="row">
        <div class="col-md-8">
            <div class="card mb-4">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <span th:class="${announcement.type.name() == 'OFFER'} ? 'badge bg-success fs-6' : 'badge bg-warning text-dark fs-6'"
                              th:text="${announcement.type.name() == 'OFFER'} ? 'Пропозиція допомоги' : 'Запит допомоги'"></span>
                        <small class="text-muted" th:text="${#temporals.format(announcement.createdAt, 'dd.MM.yyyy HH:mm')}"></small>
                    </div>

                    <h2 class="fw-bold mb-3" th:text="${announcement.title}"></h2>

                    <div class="mb-3">
                        <span th:each="cat : ${announcement.categories}"
                              class="badge bg-light text-dark border me-1" th:text="${cat.name}"></span>
                    </div>

                    <p class="text-body" th:text="${announcement.description}" style="white-space: pre-wrap;"></p>

                    <div class="mt-3 d-flex gap-3">
                        <span class="text-muted"><i class="bi bi-geo-alt me-1"></i><span th:text="${announcement.city}"></span></span>
                    </div>
                </div>
            </div>

            <!-- Apply form for VPO -->
            <div th:if="${currentUser != null && currentUser.role.name() == 'VPO' && announcement.type.name() == 'OFFER' && announcement.acceptsApplications}"
                 class="card mb-4">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-3">Подати заявку</h5>
                    <div th:if="${alreadyApplied}" class="alert alert-info">
                        Ви вже подали заявку на це оголошення
                    </div>
                    <form th:unless="${alreadyApplied}" th:action="@{/applications/apply/{id}(id=${announcement.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3">
                            <label class="form-label">Ваше повідомлення</label>
                            <textarea name="message" class="form-control" rows="4" required
                                      placeholder="Розкажіть про свою ситуацію..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Надіслати заявку</button>
                    </form>
                </div>
            </div>

            <!-- Donation link for REQUEST announcements -->
            <div th:if="${announcement.donationUrl != null && (currentUser == null || currentUser.role.name() != 'ADMIN')}"
                 class="card mb-4 border-warning">
                <div class="card-body p-4 text-center">
                    <h5 class="fw-bold">Підтримати фінансово</h5>
                    <p class="text-muted">Ви можете зробити благодійний внесок</p>
                    <a th:href="${announcement.donationUrl}" target="_blank" rel="noopener noreferrer"
                       class="btn btn-warning">Перейти до збору</a>
                </div>
            </div>

        </div>

        <div class="col-md-4">
            <!-- Author info -->
            <div class="card mb-4">
                <div class="card-body p-4 text-center">
                    <h6 class="fw-bold" th:text="${announcement.author.fullName}"></h6>
                    <p class="mb-1">
                        <span th:if="${announcement.author.role.name() == 'VPO'}" class="badge bg-warning text-dark">ВПО</span>
                        <span th:if="${announcement.author.providerType != null && announcement.author.providerType.name() == 'VOLUNTEER'}" class="badge bg-success">Волонтер</span>
                        <span th:if="${announcement.author.providerType != null && announcement.author.providerType.name() == 'ORGANIZATION'}" class="badge bg-primary">Організація</span>
                    </p>
                    <p class="text-muted small" th:if="${announcement.author.orgName != null}" th:text="${announcement.author.orgName}"></p>
                    <p class="text-muted small" th:if="${announcement.author.phone != null}">
                        <i class="bi bi-telephone me-1"></i><span th:text="${announcement.author.phone}"></span>
                    </p>
                    <a th:if="${announcement.author.isProfilePublic}"
                       th:href="@{/catalog/providers/{id}(id=${announcement.author.id})}"
                       class="btn btn-sm btn-outline-primary w-100">
                        Переглянути профіль
                    </a>
                </div>
            </div>

            <!-- Status badge — visible to author and admin only -->
        </div>
    </div>
</div>
</main>
</body>
</html>
