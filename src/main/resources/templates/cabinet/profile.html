<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{base :: layout(~{::title}, ~{::main})}"
      lang="uk">
<head>
    <title>Профіль &mdash; ВПО Платформа</title>
</head>
<body>
<main>
<div class="container py-4">
    <div class="row">
        <div th:replace="~{cabinet/sidebar :: sidebar}"></div>

        <div class="col-md-9">
            <div class="card">
                <div class="card-body p-4">
                    <h3 class="fw-bold mb-4">Редагувати профіль</h3>
                    <form th:action="@{/cabinet/profile}" th:object="${profileForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Повне ім'я *</label>
                                <input type="text" th:field="*{fullName}"
                                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                                       class="form-control">
                                <div class="invalid-feedback" th:errors="*{fullName}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Телефон *</label>
                                <input type="tel" th:field="*{phone}"
                                       th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                                       class="form-control">
                                <div class="invalid-feedback" th:errors="*{phone}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Населений пункт *</label>
                                <input type="text" th:field="*{city}"
                                       th:classappend="${#fields.hasErrors('city')} ? 'is-invalid'"
                                       class="form-control">
                                <div class="invalid-feedback" th:errors="*{city}"></div>
                            </div>

                            <!-- Organization fields -->
                            <div th:if="${user.providerType != null && user.providerType.name() == 'ORGANIZATION'}" class="col-md-6">
                                <label class="form-label fw-bold">Назва організації *</label>
                                <input type="text" th:field="*{orgName}"
                                       th:classappend="${#fields.hasErrors('orgName')} ? 'is-invalid'"
                                       class="form-control">
                                <div class="invalid-feedback" th:errors="*{orgName}"></div>
                            </div>
                            <div th:if="${user.providerType != null && user.providerType.name() == 'ORGANIZATION'}" class="col-12">
                                <label class="form-label fw-bold">Опис організації *</label>
                                <textarea th:field="*{orgDescription}"
                                          th:classappend="${#fields.hasErrors('orgDescription')} ? 'is-invalid'"
                                          class="form-control" rows="3"
                                          placeholder="Розкажіть про свою організацію..."></textarea>
                                <div class="invalid-feedback" th:errors="*{orgDescription}"></div>
                            </div>

                            <div th:if="${user.role.name() == 'PROVIDER'}" class="col-12">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" name="isProfilePublic"
                                           id="isPublic" th:checked="${profileForm.isProfilePublic}">
                                    <label class="form-check-label" for="isPublic">
                                        Показувати профіль в розділі "Волонтери та організації"
                                    </label>
                                </div>
                            </div>

                            <div th:if="${user.role.name() == 'PROVIDER'}" class="col-12">
                                <label class="form-label fw-bold">Категорії допомоги, яку я надаю *</label>
                                <div class="row g-2">
                                    <div th:each="cat : ${allCategories}" class="col-md-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox"
                                                   name="providerCategoryIds" th:value="${cat.id}"
                                                   th:id="'pcat' + ${cat.id}"
                                                   th:checked="${user.providerCategories.contains(cat)}">
                                            <label class="form-check-label" th:for="'pcat' + ${cat.id}"
                                                   th:text="${cat.name}"></label>
                                        </div>
                                    </div>
                                </div>
                                <div th:if="${#fields.hasErrors('providerCategoryIds')}"
                                     class="text-danger small mt-1" th:errors="*{providerCategoryIds}"></div>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary">Зберегти зміни</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</main>
</body>
</html>
